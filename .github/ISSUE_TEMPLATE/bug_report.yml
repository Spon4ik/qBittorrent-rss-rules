name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report only information needed to reproduce the problem. Remove API keys,
        passwords, private tracker URLs, personal file paths, and provider payloads.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the relevant screen or workflow.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest repeatable sequence and synthetic example data where possible.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: e.g. v1.4.23 or abc1234
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and whether you use Docker or the Windows desktop app.
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue and removed secrets and private data.
          required: true
