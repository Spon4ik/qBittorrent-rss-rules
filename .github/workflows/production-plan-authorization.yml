name: Production plan authorization

on:
  workflow_dispatch:
    inputs:
      plan_id:
        description: Exact plan ID under docs/plans/authorizations
        required: true
        type: string
      action:
        description: Authorize once, or append a revoke/complete transition
        required: true
        type: choice
        options:
          - authorize
          - revoke
          - complete

permissions: {}

concurrency:
  group: production-plan-authorization-${{ inputs.plan_id }}
  cancel-in-progress: false

jobs:
  require-main:
    name: Require protected main dispatch
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject non-main dispatch
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Dispatch this workflow from protected main." >&2
            exit 1
          fi

  validate-plan:
    name: Validate and display exact plan
    needs: require-main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - name: Check out workflow source from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate plan and reviewer protection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PLAN_ID: ${{ inputs.plan_id }}
          PLAN_ACTION: ${{ inputs.action }}
        run: python scripts/production_plan_authorization.py validate-request

  record-authorization:
    name: Record plan authorization
    needs: validate-plan
    if: needs.validate-plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production-plan-approval
    permissions:
      actions: read
      contents: read
      deployments: write
    steps:
      - name: Check out workflow source from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Record durable authorization Deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PLAN_ID: ${{ inputs.plan_id }}
          PLAN_ACTION: ${{ inputs.action }}
        run: python scripts/production_plan_authorization.py record-authorization
