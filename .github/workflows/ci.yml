name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run repository checks
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\check.bat

      - name: Run repository checks
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/check.sh

  browser-ui:
    name: Browser UI suite
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run maintained UI suite
        shell: cmd
        run: scripts\browser_qa.bat --suite ui

  desktop-build:
    name: WinUI desktop build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore WinUI dependencies
        run: dotnet restore QbRssRulesDesktop/QbRssRulesDesktop.csproj --locked-mode

      - name: Build WinUI desktop app
        run: dotnet build QbRssRulesDesktop/QbRssRulesDesktop.csproj --configuration Debug --no-restore -p:Platform=x64

  required:
    name: required
    if: always()
    needs: [backend-checks, browser-ui, desktop-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require every CI lane to pass
        env:
          BACKEND_CHECKS_RESULT: ${{ needs.backend-checks.result }}
          BROWSER_UI_RESULT: ${{ needs.browser-ui.result }}
          DESKTOP_BUILD_RESULT: ${{ needs.desktop-build.result }}
        run: python scripts/ci_required_gate.py
