name: qBittorrent web-seed API integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-qbittorrent-webseed-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Start pinned qBittorrent Web API
        shell: bash
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/qbittorrent-config"
          downloads_dir="$RUNNER_TEMP/qbittorrent-downloads"
          mkdir -p "$config_dir" "$downloads_dir"
          docker run --detach --tty --name qb-webseed-test \
            --publish 127.0.0.1:18089:18089 \
            --env QBT_LEGAL_NOTICE=confirm \
            --env QBT_VERSION=5.2.3 \
            --env QBT_TORRENTING_PORT=16881 \
            --env QBT_WEBUI_PORT=18089 \
            --volume "$config_dir:/config" \
            --volume "$downloads_dir:/downloads" \
            qbittorrentofficial/qbittorrent-nox@sha256:9ebb534fe30bab98622cb84a8c3acecfd88319b2d540f52ecdec7b9f866374d7

          password=""
          status=""
          for attempt in $(seq 1 60); do
            password="$(docker logs qb-webseed-test 2>&1 \
              | sed -n 's/.*A temporary password is provided for this session: //p' \
              | tail -n 1)"
            if [[ -n "$password" ]]; then
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --data-urlencode 'username=admin' \
                --data-urlencode "password=$password" \
                http://127.0.0.1:18089/api/v2/auth/login || true)"
              if [[ "$status" == "200" || "$status" == "204" ]]; then
                break
              fi
            fi
            sleep 1
          done
          if [[ -z "$password" || ( "$status" != "200" && "$status" != "204" ) ]]; then
            echo "Pinned qBittorrent Web API did not become ready."
            exit 1
          fi
          echo "::add-mask::$password"
          {
            echo "QB_WEBSEED_TEST_URL=http://127.0.0.1:18089"
            echo "QB_WEBSEED_TEST_USERNAME=admin"
            echo "QB_WEBSEED_TEST_PASSWORD=$password"
            echo "QB_WEBSEED_TEST_SAVE_PATH=/downloads"
            echo "QB_WEBSEED_TEST_REQUIRED=true"
          } >> "$GITHUB_ENV"

      - name: Install project test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify real qBittorrent add, readback, and remove
        run: >-
          python -m pytest tests/test_qbittorrent_client.py
          tests/test_qbittorrent_webseed_integration.py -q

      - name: Remove ephemeral qBittorrent
        if: always()
        run: docker rm --force qb-webseed-test || true
